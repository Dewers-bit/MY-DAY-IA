name: Build My Day APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Firebase google-services.json if provided via Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            python3 -c '
          import base64, json, os, pathlib
          raw = os.environ["GOOGLE_SERVICES_JSON"].strip()
          try:
              data = json.loads(raw)
          except Exception:
              data = json.loads(base64.b64decode(raw).decode("utf-8").strip())
          pathlib.Path("app/google-services.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print("Restored app/google-services.json from GitHub Secret/Variable.")
          ' || {
              echo "::error::O secret GOOGLE_SERVICES_JSON não contém um JSON (nem Base64) válido."
              exit 1
            }
          elif [ ! -f app/google-services.json ]; then
            echo "::error::Falta o secret GOOGLE_SERVICES_JSON no GitHub (Settings -> Secrets and variables -> Actions -> New repository secret). Sem o google-services.json a app não liga ao Firebase no telemóvel."
            exit 1
          fi
          python3 -c "import json; json.load(open('app/google-services.json'))" || {
            echo "::error::app/google-services.json não contém JSON válido. Verifique o conteúdo colado no secret GOOGLE_SERVICES_JSON."
            exit 1
          }

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret/Variable."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "Alias name:|SHA1:" || true

      - name: Accept Android SDK licenses
        run: |
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-day-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check if Release Keystore secrets are configured
        id: release_check
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release keystore secrets not set; skipping :app:assembleRelease (using debug APK only)."
          fi

      - name: Prepare Release Keystore and print Firebase fingerprints
        if: steps.release_check.outputs.enabled == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          echo "Release keystore restored. Register these fingerprints in Firebase Console (Android app) for Google Sign-In:"
          keytool -list -v -keystore my-upload-key.jks -alias upload -storepass "$RELEASE_STORE_PASSWORD" | grep -E "Alias name:|SHA1:|SHA256:" || true

      - name: Build Signed Release APK (reCAPTCHA App Check enabled)
        if: steps.release_check.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK artifact
        if: steps.release_check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-day-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: My Day (APK)
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
